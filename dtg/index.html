<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTG</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.15em;
            color: #f5f5f5;
        }
        /* Lock screen */
        #lock-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .prompt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 360px;
            padding: 2rem;
        }
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        input[type="password"] {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,107,53,0.3);
            border-radius: 4px;
            color: #f5f5f5;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.2em;
            padding: 0.75rem 1rem;
            text-align: center;
        }
        input[type="password"]:focus { outline: none; border-color: rgba(255,107,53,0.7); }
        .enter-btn {
            width: 100%;
            padding: 0.75rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #0a0a0a;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .enter-btn:hover { opacity: 0.85; }
        .remember {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.7rem;
            color: #5a4a40;
            cursor: pointer;
            user-select: none;
        }
        .remember input { accent-color: #ff6b35; cursor: pointer; }
        .error {
            font-size: 0.75rem;
            color: #ff6b35;
            letter-spacing: 0.1em;
            min-height: 1rem;
        }
        /* Main */
        #main { display: none; }
        .week-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #0d0d0d;
            border-bottom: 1px solid rgba(255,107,53,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 0.6rem 2rem;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #ffa500;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 0 0.4rem;
            font-family: sans-serif;
            line-height: 1;
            opacity: 1;
            transition: opacity 0.15s;
        }
        .nav-btn:disabled { opacity: 0.2; cursor: default; }
        .nav-btn:not(:disabled):hover { opacity: 0.65; }
        .week-label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            min-width: 240px;
            text-align: center;
        }
        #content { padding-bottom: 2rem; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="prompt">
            <div class="title">DTG</div>
            <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
            <label class="remember">
                <input type="checkbox" id="remember"> Remember me
            </label>
            <button class="enter-btn" onclick="unlock()">Enter</button>
            <div class="error" id="err"></div>
        </div>
    </div>

    <div id="main">
        <div class="week-nav">
            <button class="nav-btn" id="prev-btn" onclick="prevWeek()" disabled>&#8249;</button>
            <span class="week-label" id="week-label"></span>
            <button class="nav-btn" id="next-btn" onclick="nextWeek()" disabled>&#8250;</button>
        </div>
        <div id="content"></div>
    </div>

    <script>
        let savedPassword = null;
        let weeks = [];
        let currentIndex = 0;
        const STORAGE_KEY = 'dtg_pw';

        function fromBase64(b64) {
            return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        }

        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
                km,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
        }

        function weekLabel(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return 'Week of ' + months[m-1] + ' ' + d + ', ' + y;
        }

        function updateNavButtons() {
            document.getElementById('prev-btn').disabled = currentIndex >= weeks.length - 1;
            document.getElementById('next-btn').disabled = currentIndex <= 0;
        }

        async function loadWeek(index, passwordOverride) {
            const pw = passwordOverride || savedPassword;
            const weekDate = weeks[index];
            const res = await fetch('week-' + weekDate + '.json');
            if (!res.ok) throw new Error('week fetch failed');
            const payload = await res.json();
            const key = await deriveKey(pw, fromBase64(payload.salt));
            const dec = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: fromBase64(payload.iv) },
                key,
                fromBase64(payload.ct)
            );
            const html = new TextDecoder().decode(dec);
            const content = document.getElementById('content');
            content.innerHTML = html;
            // Re-execute inline scripts (row highlighting etc.)
            content.querySelectorAll('script').forEach(s => {
                const ns = document.createElement('script');
                ns.textContent = s.textContent;
                document.body.appendChild(ns);
                document.body.removeChild(ns);
            });
            document.getElementById('week-label').textContent = weekLabel(weekDate);
            currentIndex = index;
            updateNavButtons();
            window.scrollTo(0, 0);
        }

        function prevWeek() {
            // prev = older = higher index (weeks[0] is newest)
            if (currentIndex < weeks.length - 1) loadWeek(currentIndex + 1).catch(() => {});
        }

        function nextWeek() {
            // next = newer = lower index
            if (currentIndex > 0) loadWeek(currentIndex - 1).catch(() => {});
        }

        async function tryUnlock(password) {
            const manifestRes = await fetch('manifest.json');
            if (!manifestRes.ok) throw new Error('no manifest');
            weeks = await manifestRes.json();
            if (!weeks || weeks.length === 0) throw new Error('empty manifest');
            // Validates password — throws on wrong key
            await loadWeek(0, password);
            savedPassword = password;
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main').style.display = 'block';
        }

        async function unlock() {
            const password = document.getElementById('pw').value;
            if (!password) return;
            try {
                if (document.getElementById('remember').checked) {
                    localStorage.setItem(STORAGE_KEY, password);
                }
                await tryUnlock(password);
            } catch {
                try { localStorage.removeItem(STORAGE_KEY); } catch {}
                const err = document.getElementById('err');
                if (err) err.textContent = 'Incorrect password.';
                const pw = document.getElementById('pw');
                if (pw) pw.value = '';
            }
        }

        (async () => {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { await tryUnlock(saved); } catch { try { localStorage.removeItem(STORAGE_KEY); } catch {} }
            }
        })();
    </script>
</body>
</html>
