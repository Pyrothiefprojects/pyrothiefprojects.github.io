<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTG</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.15em;
            color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .prompt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 360px;
            padding: 2rem;
        }
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        input[type="password"] {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,107,53,0.3);
            border-radius: 4px;
            color: #f5f5f5;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.2em;
            padding: 0.75rem 1rem;
            text-align: center;
        }
        input[type="password"]:focus { outline: none; border-color: rgba(255,107,53,0.7); }
        button {
            width: 100%;
            padding: 0.75rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #0a0a0a;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { opacity: 0.85; }
        .remember {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.7rem;
            color: #5a4a40;
            cursor: pointer;
            user-select: none;
        }
        .remember input { accent-color: #ff6b35; cursor: pointer; }
        .error {
            font-size: 0.75rem;
            color: #ff6b35;
            letter-spacing: 0.1em;
            min-height: 1rem;
        }
    </style>
</head>
<body>
    <div class="prompt">
        <div class="title">DTG</div>
        <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
        <label class="remember">
            <input type="checkbox" id="remember">
            Remember me
        </label>
        <button onclick="unlock()">Enter</button>
        <div class="error" id="err"></div>
    </div>

        const STORAGE_KEY = 'dtg_pw';

        function fromBase64(b64) {
            return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        }

        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
                km,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
        }

        async function tryUnlock(password) {
            const salt = fromBase64(PAYLOAD.salt);
            const iv   = fromBase64(PAYLOAD.iv);
            const ct   = fromBase64(PAYLOAD.ct);
            const key  = await deriveKey(password, salt);
            const dec  = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
            const html = new TextDecoder().decode(dec);
            document.open();
            document.write(html);
            document.close();
        }

        async function unlock() {
            const password = document.getElementById('pw').value;
            if (!password) return;
            try {
                if (document.getElementById('remember').checked) {
                    localStorage.setItem(STORAGE_KEY, password);
                }
                await tryUnlock(password);
            } catch {
                try { localStorage.removeItem(STORAGE_KEY); } catch {}
                const err = document.getElementById('err');
                if (err) err.textContent = 'Incorrect password.';
                const pw = document.getElementById('pw');
                if (pw) pw.value = '';
            }
        }

        (async () => {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { await tryUnlock(saved); } catch { try { localStorage.removeItem(STORAGE_KEY); } catch {} }
            }
        })();
    </script>
