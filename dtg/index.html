<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTG</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.15em;
            color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .prompt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 360px;
            padding: 2rem;
        }
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        input[type="password"] {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,107,53,0.3);
            border-radius: 4px;
            color: #f5f5f5;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.2em;
            padding: 0.75rem 1rem;
            text-align: center;
        }
        input[type="password"]:focus { outline: none; border-color: rgba(255,107,53,0.7); }
        button {
            width: 100%;
            padding: 0.75rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #0a0a0a;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { opacity: 0.85; }
        .remember {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.7rem;
            color: #5a4a40;
            cursor: pointer;
            user-select: none;
        }
        .remember input { accent-color: #ff6b35; cursor: pointer; }
        .error {
            font-size: 0.75rem;
            color: #ff6b35;
            letter-spacing: 0.1em;
            min-height: 1rem;
        }
    </style>
</head>
<body>
    <div class="prompt">
        <div class="title">DTG</div>
        <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
        <label class="remember">
            <input type="checkbox" id="remember">
            Remember me
        </label>
        <button onclick="unlock()">Enter</button>
        <div class="error" id="err"></div>
    </div>
    <script>
        const PAYLOAD = {"salt":"OewP/j97jKXCa5JIESSezA==","iv":"bOXRd3aAIuSKPCYh","ct":"yBsnTavx3CuqFoKny+n9K1+NePjyrnJQQW7AZ3+JSpANJyqBIqz9KZgKUJWsbuPFqV5UgA6VyrzPPE/e7HxYGffk75zPSn58U7YZgKCgQZ6WjWFmTTyFU5uf42aLZ2594pdbNHfrDT2QIw5Ajh1h2a4Uzu2BNM2S+CPDxJSSkUHG2czdycG6GKez0PG2CIuORTrgzEqoFMlE7MpkzBJ0JEFMsmOCFh3KVaW8K5iO2nC8W9fmkO3wPj3gURL/TGZnExA4hWadnH06VbIGO9pGvBOyxZwJfwLOtIFASzwMyChZk+K+kBeovpjHCKt8U+dJlh49NvFvE3eVbJqPnfW5qKRoIdOzJzjqkUYpiMRwrcGrtOXBvuIhmLx4dzL2/OywBgw0zTz0caVwJ6VRzshij+kqXpQgPehJi+GvwwytkCF3auWGP83y5YAnj3p4URmjOBwZOf/Sk8qtP+jHn72o5ORU+jTZhxIu8ApDO8UqM91pcMqKeTddLe830atDU/RDJJx3CcfnBXfJijQ1TkC2LF3Ti2Kmm6clB7cHV0x6bqVKo56JzysqEeB8NxrqDvezV4zdlaBOdrbdYfkRfRP41A0+NG9zeXNwswO8Y/VE8JcgjFiaUkalQci/1dq0My/w+QgnHyu/20Rc0pMfQRPmkd1Xszhz7/PAdwOsztOOY/FcJ8r+PlnpE6QacClytqHX+yHZtMQSVepIxC9WnkobbUjcxQgbg3XvxsodE9EoQmrrJCA/QqJIP0KD4cwY5eje0z+CmwNLsR28hox9URswrkpLoPqwP3z3bA6TcCHgM30SgYijgJT/c6BOhuZ/xfzAsUU8vzHCeMpYWczaWBSoipZBTpwuYIH8JrxmeXIL+fVuWOZXD0bBucIjDLnYFon/YUH2cve/+TARSb0G9AmoYvCz3l017DUtmLkPPNZ4ZKWDzvOzDNOYsQAuyAsx7rtL+zVduJ7bS3Y6mVNYGuZ6SvYQmWX9TkJ80I437EYEQ/7QP4Wes0M3pCYT+FkVRUt+ku+R+d38GHHc34VQbTBLzu/UHQ5schTCtLsgsRCSiNju/mR0JUzHWbCW7UGwlnCEWOumWw/nfla0zr2xgrMPr/cojXizjo4oiEFneHw3mMZyA3d/z+qKzM6k6KVgqULy74bZq9gnjIQgb0lc1HtfRITXQAuTNmVw4y5NULy/pCYQvU/aue8nIbRf4ldCnDumBWNm7nH26eFs+gJFLop3ji5UHSSpFx3Zg2tuUDcWACB2hj8unnnNriyJUMj7FZGkKbojyPq5uieBJO8HMWciwtkb6cvkKO92Tpyar9QrDHq/vAakB/hjWZ+HlkzFKY/5AJQpHeKJ/tQ4eAbSSMmB4q4sibuqzlsE3hAY1TJcpumvIyPKe3uLqgpf+6ZmYeKEzygCdtnIjZ1ELxl+8gIiZg8x1QaNvpg="};
        const STORAGE_KEY = 'dtg_pw';

        function fromBase64(b64) {
            return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        }

        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
                km,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
        }

        async function tryUnlock(password) {
            const salt = fromBase64(PAYLOAD.salt);
            const iv   = fromBase64(PAYLOAD.iv);
            const ct   = fromBase64(PAYLOAD.ct);
            const key  = await deriveKey(password, salt);
            const dec  = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
            const html = new TextDecoder().decode(dec);
            document.open();
            document.write(html);
            document.close();
        }

        async function unlock() {
            const password = document.getElementById('pw').value;
            if (!password) return;
            try {
                if (document.getElementById('remember').checked) {
                    localStorage.setItem(STORAGE_KEY, password);
                }
                await tryUnlock(password);
            } catch {
                localStorage.removeItem(STORAGE_KEY);
                document.getElementById('err').textContent = 'Incorrect password.';
                document.getElementById('pw').value = '';
            }
        }

        (async () => {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { await tryUnlock(saved); } catch { localStorage.removeItem(STORAGE_KEY); }
            }
        })();
    </script>
</body>
</html>
