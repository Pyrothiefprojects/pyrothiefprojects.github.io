<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTG</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.15em;
            color: #f5f5f5;
        }
        #lock-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .prompt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 360px;
            padding: 2rem;
        }
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        input[type="password"] {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,107,53,0.3);
            border-radius: 4px;
            color: #f5f5f5;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.2em;
            padding: 0.75rem 1rem;
            text-align: center;
        }
        input[type="password"]:focus { outline: none; border-color: rgba(255,107,53,0.7); }
        .enter-btn {
            width: 100%;
            padding: 0.75rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #0a0a0a;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .enter-btn:hover { opacity: 0.85; }
        .remember {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.7rem;
            color: #5a4a40;
            cursor: pointer;
            user-select: none;
        }
        .remember input { accent-color: #ff6b35; cursor: pointer; }
        .error {
            font-size: 0.75rem;
            color: #ff6b35;
            letter-spacing: 0.1em;
            min-height: 1rem;
        }
        #main { display: none; }
        #content { padding-bottom: 2rem; }
        /* Injected nav arrows — sit alongside .page-subtitle */
        .dtg-nav-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }
        .dtg-nav-arrow {
            background: none;
            border: none;
            color: #ffa500;
            font-size: 1.6rem;
            font-family: sans-serif;
            line-height: 1;
            cursor: pointer;
            padding: 0 0.2rem;
            transition: opacity 0.15s;
            vertical-align: middle;
        }
        .dtg-nav-arrow:disabled { opacity: 0.15; cursor: default; }
        .dtg-nav-arrow:not(:disabled):hover { opacity: 0.6; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="prompt">
            <div class="title">DTG</div>
            <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
            <label class="remember">
                <input type="checkbox" id="remember"> Remember me
            </label>
            <button class="enter-btn" onclick="unlock()">Enter</button>
            <div class="error" id="err"></div>
        </div>
    </div>

    <div id="main">
        <div id="content"></div>
    </div>

    <script>
        let savedPassword = null;
        let weeks = [];
        let currentIndex = 0;
        const STORAGE_KEY = 'dtg_pw';

        function fromBase64(b64) {
            return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        }

        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
                km,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
        }

        function injectNavArrows() {
            const subtitle = document.querySelector('#content .page-subtitle');
            if (!subtitle || subtitle.parentNode.classList.contains('dtg-nav-wrap')) return;

            const wrap = document.createElement('div');
            wrap.className = 'dtg-nav-wrap';

            const prev = document.createElement('button');
            prev.className = 'dtg-nav-arrow';
            prev.innerHTML = '&#8249;';
            prev.disabled = currentIndex >= weeks.length - 1;
            prev.onclick = prevWeek;

            const next = document.createElement('button');
            next.className = 'dtg-nav-arrow';
            next.innerHTML = '&#8250;';
            next.disabled = currentIndex <= 0;
            next.onclick = nextWeek;

            subtitle.parentNode.replaceChild(wrap, subtitle);
            wrap.appendChild(prev);
            wrap.appendChild(subtitle);
            wrap.appendChild(next);
        }

        async function loadWeek(index, passwordOverride) {
            const pw = passwordOverride || savedPassword;
            const weekDate = weeks[index];
            const res = await fetch('week-' + weekDate + '.json');
            if (!res.ok) throw new Error('week fetch failed');
            const payload = await res.json();
            const key = await deriveKey(pw, fromBase64(payload.salt));
            const dec = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: fromBase64(payload.iv) },
                key,
                fromBase64(payload.ct)
            );
            const html = new TextDecoder().decode(dec);
            const content = document.getElementById('content');
            content.innerHTML = html;
            // Re-execute inline scripts (row click highlighting etc.)
            content.querySelectorAll('script').forEach(s => {
                const ns = document.createElement('script');
                ns.textContent = s.textContent;
                document.body.appendChild(ns);
                document.body.removeChild(ns);
            });
            currentIndex = index;
            injectNavArrows();
            window.scrollTo(0, 0);
        }

        function prevWeek() {
            if (currentIndex < weeks.length - 1) loadWeek(currentIndex + 1).catch(() => {});
        }
        function nextWeek() {
            if (currentIndex > 0) loadWeek(currentIndex - 1).catch(() => {});
        }

        function findCurrentWeekIndex() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            for (let i = 0; i < weeks.length; i++) {
                const start = new Date(weeks[i] + 'T00:00:00');
                const end = new Date(start);
                end.setDate(end.getDate() + 6);
                if (today >= start && today <= end) return i;
            }
            for (let i = 0; i < weeks.length; i++) {
                const start = new Date(weeks[i] + 'T00:00:00');
                if (start <= today) return i;
            }
            return weeks.length - 1;
        }

        async function tryUnlock(password) {
            const manifestRes = await fetch('manifest.json');
            if (!manifestRes.ok) throw new Error('no manifest');
            weeks = await manifestRes.json();
            if (!weeks || weeks.length === 0) throw new Error('empty manifest');
            await loadWeek(findCurrentWeekIndex(), password);
            savedPassword = password;
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main').style.display = 'block';
        }

        async function unlock() {
            const password = document.getElementById('pw').value;
            if (!password) return;
            try {
                if (document.getElementById('remember').checked) {
                    localStorage.setItem(STORAGE_KEY, password);
                }
                await tryUnlock(password);
            } catch {
                try { localStorage.removeItem(STORAGE_KEY); } catch {}
                const err = document.getElementById('err');
                if (err) err.textContent = 'Incorrect password.';
                const pw = document.getElementById('pw');
                if (pw) pw.value = '';
            }
        }

        (async () => {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { await tryUnlock(saved); } catch { try { localStorage.removeItem(STORAGE_KEY); } catch {} }
            }
        })();
    </script>
</body>
</html>
