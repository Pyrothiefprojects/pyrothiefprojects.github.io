<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTG Encryptor</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.1em;
            color: #f5f5f5;
            padding: 3rem 2rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
        }
        .note {
            color: #5a4a40;
            font-size: 0.75rem;
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
        }
        label {
            display: block;
            font-size: 0.75rem;
            color: #a89080;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        textarea, input[type="password"] {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,107,53,0.2);
            border-radius: 4px;
            color: #f5f5f5;
            font-family: monospace;
            font-size: 0.85rem;
            padding: 0.75rem;
            margin-bottom: 1.5rem;
            resize: vertical;
        }
        textarea { height: 200px; }
        input[type="password"] { height: 2.5rem; letter-spacing: 0.2em; }
        button {
            padding: 0.75rem 2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #0a0a0a;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 2rem;
        }
        button:hover { opacity: 0.85; }
        #output-section { display: none; }
        #output {
            width: 100%;
            height: 300px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,107,53,0.2);
            border-radius: 4px;
            color: #a89080;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 0.75rem;
            margin-bottom: 1rem;
            resize: vertical;
        }
        .copy-btn {
            background: rgba(255,255,255,0.03);
            color: #ff6b35;
            border: 1px solid rgba(255,107,53,0.3);
            padding: 0.5rem 1.5rem;
            font-size: 0.75rem;
        }
        .status {
            font-size: 0.75rem;
            color: #ff6b35;
            margin-top: 0.5rem;
            min-height: 1rem;
        }
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,107,53,0.3), transparent);
            margin: 2rem 0;
        }
    </style>
</head>
<body>
    <h1>DTG — Page Encryptor</h1>
    <p class="note">Run this locally only. Paste your page HTML, enter a password, and copy the encrypted output into index.html.</p>

    <div class="divider"></div>

    <label>Page HTML to encrypt</label>
    <textarea id="content" placeholder="Paste the full HTML of your page here..."></textarea>

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter encryption password">

    <button onclick="encrypt()">Encrypt</button>

    <div id="output-section">
        <div class="divider"></div>
        <label>Encrypted output — copy this into index.html</label>
        <textarea id="output" readonly></textarea>
        <button class="copy-btn" onclick="copyOutput()">Copy to Clipboard</button>
        <p class="status" id="status"></p>
    </div>

    <script>
        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        function toBase64(buffer) {
            return btoa(String.fromCharCode(...new Uint8Array(buffer)));
        }

        async function encrypt() {
            const content = document.getElementById('content').value.trim();
            const password = document.getElementById('password').value;

            if (!content || !password) {
                alert('Please provide both content and a password.');
                return;
            }

            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv   = crypto.getRandomValues(new Uint8Array(12));
            const key  = await deriveKey(password, salt);

            const enc = new TextEncoder();
            const ciphertext = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv },
                key,
                enc.encode(content)
            );

            const payload = JSON.stringify({
                salt: toBase64(salt),
                iv:   toBase64(iv),
                ct:   toBase64(ciphertext)
            });

            const output = buildOutputPage(payload);
            document.getElementById('output').value = output;
            document.getElementById('output-section').style.display = 'block';
            document.getElementById('status').textContent = '';
        }

        function copyOutput() {
            const output = document.getElementById('output');
            output.select();
            document.execCommand('copy');
            document.getElementById('status').textContent = 'Copied to clipboard.';
        }

        function buildOutputPage(payload) {
            return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTG</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.15em;
            color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .prompt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 360px;
            padding: 2rem;
        }
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        input[type="password"] {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,107,53,0.3);
            border-radius: 4px;
            color: #f5f5f5;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.2em;
            padding: 0.75rem 1rem;
            text-align: center;
        }
        input[type="password"]:focus { outline: none; border-color: rgba(255,107,53,0.7); }
        button {
            width: 100%;
            padding: 0.75rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #0a0a0a;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { opacity: 0.85; }
        .error {
            font-size: 0.75rem;
            color: #ff6b35;
            letter-spacing: 0.1em;
            min-height: 1rem;
        }
    </style>
</head>
<body>
    <div class="prompt">
        <div class="title">DTG</div>
        <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
        <button onclick="unlock()">Enter</button>
        <div class="error" id="err"></div>
    </div>
    <script>
        const PAYLOAD = ${payload};

        function fromBase64(b64) {
            return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        }

        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
                km,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
        }

        async function unlock() {
            const password = document.getElementById('pw').value;
            if (!password) return;
            try {
                const salt = fromBase64(PAYLOAD.salt);
                const iv   = fromBase64(PAYLOAD.iv);
                const ct   = fromBase64(PAYLOAD.ct);
                const key  = await deriveKey(password, salt);
                const dec  = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
                const html = new TextDecoder().decode(dec);
                document.open();
                document.write(html);
                document.close();
            } catch {
                document.getElementById('err').textContent = 'Incorrect password.';
                document.getElementById('pw').value = '';
            }
        }
    <\/script>
</body>
</html>`;
        }
    </script>
</body>
</html>
