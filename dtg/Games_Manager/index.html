<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyrothief Projects — Games Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            background: radial-gradient(ellipse at center top, #1a0f08 0%, #0a0a0a 60%);
            font-family: 'Orbitron', system-ui, sans-serif;
            letter-spacing: 0.15em;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .glow {
            position: fixed;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(255, 107, 53, 0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .logo {
            max-width: 180px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 30px rgba(255, 107, 53, 0.25));
        }

        .project-title {
            font-size: clamp(1.8rem, 6vw, 3rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffa500 0%, #ff6b35 50%, #cc4400 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            color: #8a7a6a;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .divider {
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 53, 0.3), transparent);
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: #a89080;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border: 1px solid rgba(255, 107, 53, 0.2);
            border-radius: 4px;
            padding: 0.75rem 1.5rem;
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        .github-link:hover {
            color: #ff6b35;
            border-color: rgba(255, 107, 53, 0.5);
        }

        .github-link svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .testflight-link {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: #0a0a0a;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            border-radius: 4px;
            padding: 0.75rem 1.5rem;
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.3);
            transition: box-shadow 0.3s ease, transform 0.2s ease;
        }

        .testflight-link:hover {
            box-shadow: 0 6px 30px rgba(255, 107, 53, 0.5);
            transform: translateY(-1px);
        }

        .testflight-link svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .link-note {
            color: #5a4a40;
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: -0.5rem;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 1.5rem 2rem;
            text-align: center;
            border-top: 1px solid rgba(255, 107, 53, 0.08);
        }

        .footer-brand {
            color: #3a2a20;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="glow"></div>

    <div class="container">
        <img src="/pyrothieflogo.png" alt="Pyrothief Projects" class="logo">
        <h1 class="project-title">Games Manager</h1>
        <p class="tagline">Staff scheduling &amp; floor management</p>
        <div class="divider"></div>
        <a href="https://testflight.apple.com/join/UFWrnz5X" target="_blank" rel="noopener" class="testflight-link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
            Join TestFlight Beta
        </a>
        <p class="link-note">iOS / iPadOS — requires TestFlight app</p>
        <div class="divider"></div>
        <a href="https://github.com/Pyrothiefprojects/pyrothiefprojects.github.io/blob/main/dtg/Games_Manager/README_Games_Manager.md" target="_blank" rel="noopener" class="github-link">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            View on GitHub
        </a>
    </div>

    <footer>
        <div class="footer-brand">Pyrothiefprojects &copy; 2026</div>
    </footer>
</body>
</html>
