<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyrothief Projects</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.15em;
            color: #f5f5f5;
            overflow: hidden;
        }
        /* The sphere fills the window behind everything */
        #sphere {
            position: fixed;
            inset: 0;
            touch-action: none;
        }
        /* The header: the PYROTHIEF wordmark (pyrothieftext.png), centred at the top, outside and inside. The image's black
           background is screened away, so only the letters show over the stars */
        main {
            position: fixed;
            top: 1.65rem;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;   /* drags and hovers go through to the sphere */
        }
        .wordmark {
            display: block;
            height: 22px;
            width: auto;
            mix-blend-mode: screen;
            opacity: 0;   /* until the flame gathers (the frame sets it) */
        }
        /* PROJECTS (projectstext.png): under the wordmark, lined up with its right edge as in the logo; as you zoom in it
           slides to the left margin, level with the wordmark, and becomes the button for the menu (the frame places it) */
        .projects-button {
            position: fixed;
            top: 0;
            left: 0;
            padding: 0;
            background: none;
            border: none;
            transform-origin: 0 0;
            pointer-events: none;
            opacity: 0;   /* until the flame gathers (the frame sets it) */
            will-change: transform;
            transition: filter 0.2s;
        }
        .projects-button::after {   /* a bigger target than the thin lettering, for fingers */
            content: "";
            position: absolute;
            inset: -12px -10px;
        }
        .projects-button.live { pointer-events: auto; cursor: pointer; }
        .projects-button.live:hover { filter: brightness(1.25); }
        .projects-button.open { filter: drop-shadow(0 0 8px rgba(244, 111, 12, 0.7)); }
        .wordmark-sub {
            display: block;
            height: 12px;
            width: auto;
        }
        @media (max-width: 600px) {
            .wordmark { height: 16px; }
            .wordmark-sub { height: 9px; }
        }
        /* While the menu is open: the stars dim behind it (darkest at the top left, where the menu is) so the rows read
           clearly. It doesn't catch the pointer, so a tap on the stars still closes the menu */
        .dim {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 0% 0%, rgba(10, 10, 10, 0.9), rgba(10, 10, 10, 0.62) 55%,
                rgba(10, 10, 10, 0.5));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .dim.on { opacity: 1; }
        /* The Projects menu: under the header, rows sliding in one after another */
        .projects-menu {
            position: fixed;
            top: 4.6rem;
            left: 1rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.15rem;
            padding: 0.6rem 0.4rem 0.6rem 0;
            max-height: calc(100vh - 5.6rem);   /* scrolls rather than running off a short screen */
            overflow-y: auto;
            overscroll-behavior: contain;
        }
        .projects-menu[hidden] { display: none; }
        /* An empty space between the projects and Privacy / License */
        .projects-menu .menu-gap { height: 1.1rem; flex: none; }
        .projects-menu button {
            position: relative;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.62);
            background: none;
            border: none;
            padding: 0.45rem 0.6rem 0.45rem 0.9rem;
            cursor: pointer;
            text-align: left;
            text-shadow: 0 0 10px #0a0a0a;
            animation: rowIn 0.38s cubic-bezier(0.2, 0.8, 0.2, 1) both;
            animation-delay: calc(var(--i, 0) * 55ms);
        }
        /* The bar at the left, grown in on hover or when it's the one showing */
        .projects-menu button::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 2px;
            height: 0;
            background: linear-gradient(180deg, #ffa500, #ff6b35);
            transform: translateY(-50%);
            transition: height 0.2s;
        }
        /* (lit: the #drift tour's pointer over it, as a hover) */
        .projects-menu button:hover, .projects-menu button.on, .projects-menu button.lit {
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }
        /* Hovered, brighter still */
        .projects-menu button:hover, .projects-menu button.lit { filter: brightness(1.35) drop-shadow(0 0 6px rgba(255, 140, 60, 0.55)); }
        .projects-menu button:hover::before, .projects-menu button.on::before, .projects-menu button.lit::before { height: 70%; }
        @keyframes rowIn {
            from { opacity: 0; transform: translateX(-14px); }
            to { opacity: 1; transform: none; }
        }
        /* A project's card: glass, low in the middle, rising in (its icon forms in dots above it) */
        .card {
            position: fixed;
            left: 50%;
            bottom: 5.2rem;
            width: min(520px, calc(100vw - 2rem));
            padding: 1.4rem 1.5rem 1.3rem;
            background: rgba(10, 10, 10, 0.55);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            opacity: 0;
            /* --dx: sideways, for a codex flip (out the way it's going, in from the other side) */
            transform: translate(-50%, 0) translate(var(--dx, 0px), 18px);
            transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            pointer-events: none;
        }
        .card[hidden] { display: none; }
        .card.shown { opacity: 1; transform: translate(-50%, 0) translate(0, 0); pointer-events: auto; }
        .card.still { transition: none; }
        /* On a phone, tucked away while the Projects menu is open (no room for both); back when it closes */
        .card.shown.tucked { opacity: 0; transform: translate(-50%, 0) translate(0, 18px); pointer-events: none; }
        /* The codex's pages: one dot per project, the one showing lit */
        /* The codex's dots: under PROJECTS, lined up with its left edge, while a project is up and the menu is closed
           (the frame places them) */
        .card-pager {
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card-pager button {
            width: 7px;
            height: 7px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(245, 245, 245, 0.25);
            cursor: pointer;
            transition: transform 0.25s, background 0.25s;
        }
        .card-pager button.on {
            background: linear-gradient(180deg, #fd9d0a, #e8271e);
            transform: scale(1.4);
            box-shadow: 0 0 8px rgba(244, 111, 12, 0.7);
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.75);
            border: 1px solid rgba(245, 245, 245, 0.18);
            border-radius: 999px;
            padding: 0.3rem 0.65rem;
        }
        .pill[hidden] { display: none; }
        .pill i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--status, #ff6b35);
            box-shadow: 0 0 8px var(--status, #ff6b35);
        }
        .card-tagline {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            color: #ffb27a;
            margin-bottom: 0.75rem;
        }
        .card-text {
            font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
            font-size: 0.95rem;
            line-height: 1.55;
            letter-spacing: normal;
            color: rgba(245, 245, 245, 0.86);
            margin-bottom: 0.9rem;
            /* A long one (the License) scrolls inside the card, so the card never covers the icon above it */
            max-height: 36vh;
            overflow-y: auto;
            overscroll-behavior: contain;
        }
        .card-text p + p { margin-top: 0.65rem; }
        .card-text h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #ffb27a;
            margin: 0.9rem 0 0.25rem;
        }
        .card-text h3:first-child { margin-top: 0; }
        .card-tech {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.45);
        }
        /* The HUD: a project shown around its icon instead of in a card — its name and tagline above, its status and tech
           below, and leader lines drawing out from the icon to short labels that type themselves in (the frame places it
           all). On a phone the labels stack in a list under it */
        .hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .hud[hidden] { display: none; }
        .hud.shown { opacity: 1; }
        .hud.shown.tucked { opacity: 0; }
        /* A project whose HUD is laid out (so its icon sits where the others do) but not shown */
        .hud.veiled { visibility: hidden; }
        .hud-lines {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        .hud-lines path {
            fill: none;
            stroke: rgba(244, 111, 12, 0.85);
            stroke-width: 1.2;
        }
        .hud-lines circle { fill: #fd9d0a; }
        .hud-head, .hud-foot {
            position: absolute;
            text-align: center;
            white-space: nowrap;
        }
        .hud-head { transform: translate(-50%, -100%); }
        /* The badge, then the platforms, on one line */
        .hud-foot {
            transform: translate(-50%, 0);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 0.75rem;
        }
        .hud-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hud-tagline {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            color: #ffb27a;
            margin-top: 0.35rem;
            text-shadow: 0 0 10px #0a0a0a;
        }
        .hud-tech {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.56rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.45);
        }
        /* A project's link (Drift Remote's TestFlight), on the badge line — the one part of the HUD that takes a click */
        .hud-link {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.56rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            /* The site's orange, glowing (breathing a little), no underline */
            color: #ff8a3d;
            text-decoration: none;
            text-shadow: 0 0 6px rgba(255, 107, 53, 0.85), 0 0 14px rgba(255, 107, 53, 0.45);
            animation: betaGlow 2.4s ease-in-out infinite;
            pointer-events: auto;
            transition: color 0.2s;
        }
        @keyframes betaGlow {
            50% { text-shadow: 0 0 9px rgba(255, 107, 53, 1), 0 0 22px rgba(255, 107, 53, 0.6); }
        }
        .hud-link[hidden] { display: none; }
        .hud-link:hover { color: #ffa500; }
        .hud-label {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.66rem;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.92);
            white-space: nowrap;
            text-shadow: 0 0 10px #0a0a0a, 0 0 3px #0a0a0a;
        }
        .hud-label[hidden] { display: none; }
        /* A phone: the labels as a list, each with a short sunrise tick */
        .hud-label.listed { white-space: normal; max-width: calc(100vw - 48px); }
        .hud-label.listed::before {
            content: "";
            display: inline-block;
            width: 14px;
            height: 1px;
            margin-right: 0.6rem;
            vertical-align: middle;
            background: linear-gradient(90deg, #fd9d0a, #e8271e);
        }
        @media (max-width: 600px) {
            .hud-name { font-size: 1.1rem; }
            .hud-tagline { font-size: 0.62rem; }
        }
        /* The tour's ghost cursor: a glowing ring with a bright centre; a click ripples out from it. Hidden for now — it
           still points and clicks (the flame gathers, the dots part), it just isn't drawn */
        .ghost {
            visibility: hidden;
            position: fixed;
            left: 0;
            top: 0;
            width: 26px;
            height: 26px;
            margin: -13px 0 0 -13px;
            border-radius: 50%;
            border: 2px solid rgba(255, 178, 122, 0.95);
            box-shadow: 0 0 12px rgba(255, 107, 53, 0.8), inset 0 0 6px rgba(255, 107, 53, 0.6);
            pointer-events: none;
            opacity: 0;
        }
        .ghost::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 6px;
            height: 6px;
            margin: -3px 0 0 -3px;
            border-radius: 50%;
            background: #ffe0b0;
            box-shadow: 0 0 6px #ffb27a;
        }
        .ghost.click::after {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 2px solid #ffb27a;
            animation: ghostClick 0.6s ease-out forwards;
        }
        @keyframes ghostClick { from { transform: scale(1); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
        /* A link to the full text (Privacy, License) */
        .card-link {
            display: inline-block;
            margin-top: 0.8rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ffb27a;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 107, 53, 0.4);
            padding-bottom: 0.15rem;
        }
        .card-link[hidden], .card-pager[hidden] { display: none; }
        .card-link:hover { color: #ff6b35; border-color: #ff6b35; }
        /* A phone: the menu across the top, bigger rows; the card along the bottom */
        @media (max-width: 600px) {
            .projects-menu { right: 1rem; }
            .projects-menu button { font-size: 0.8rem; padding: 0.65rem 0.6rem 0.65rem 0.9rem; }
            .card { bottom: 4.6rem; padding: 1.1rem 1.1rem 1rem; }
            .card-text { font-size: 0.9rem; }
        }
        /* Back out of the sphere (shown while inside) */
        .exit {
            position: fixed;
            top: 1.1rem;
            right: 1rem;
            width: 2.5rem;
            height: 2.5rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: #ff6b35;
            background: rgba(10, 10, 10, 0.35);   /* an orange ring with an orange ✕ */
            border: 1.5px solid #ff6b35;
            border-radius: 50%;
            cursor: pointer;
            transition: box-shadow 0.2s, color 0.2s, border-color 0.2s;
        }
        .exit:hover { color: #ffa500; border-color: #ffa500; box-shadow: 0 0 12px rgba(255, 107, 53, 0.5); }
        .exit[hidden] { display: none; }
        /* The Drift Remote tutorial's backdrop (#backdrop, or told so as its Splash ends): the stars alone, nothing else */
        html.backdrop body > :not(#sphere) { visibility: hidden !important; }
    </style>
</head>
<body>
    <canvas id="sphere"></canvas>
    <div class="dim" id="dim"></div>
    <main id="main">
        <img class="wordmark" id="wordmark" src="content/logo/pyrothieftext.png" alt="Pyrothief">
    </main>
    <button type="button" class="projects-button" id="lockup" aria-label="Projects" aria-expanded="false" tabindex="-1">
        <img class="wordmark-sub" src="content/logo/projectstext.png" alt="Projects">
    </button>
    <button type="button" class="exit" id="exit" aria-label="Back out of the sphere" hidden>✕</button>
    <nav class="projects-menu" id="projectsMenu" aria-label="Projects" hidden>
        <button type="button" data-project="nova">Nova</button>
        <button type="button" data-project="drift">Drift Remote</button>
        <button type="button" data-project="games">DTG</button>
        <div class="menu-gap" aria-hidden="true"></div>
        <button type="button" data-project="privacy">Privacy</button>
        <button type="button" data-project="license">License</button>
    </nav>
    <article class="card" id="card" aria-live="polite" hidden>
        <p class="card-tagline" id="cardTagline"></p>
        <div class="card-text" id="cardText"></div>
        <p class="card-tech" id="cardTech"></p>
        <a class="card-link" id="cardLink" hidden></a>
    </article>
    <div class="hud" id="hud" aria-live="polite" hidden>
        <svg class="hud-lines" id="hudLines" aria-hidden="true"></svg>
        <div class="hud-head" id="hudHead">
            <div class="hud-name" id="hudName"></div>
            <div class="hud-tagline" id="hudTagline"></div>
        </div>
        <div class="hud-foot" id="hudFoot">
            <span class="pill"><i></i><span id="hudStatusText"></span></span>
            <div class="hud-tech" id="hudTech"></div>
            <a class="hud-link" id="hudLink" target="_blank" rel="noopener" hidden></a>
        </div>
    </div>
    <div class="card-pager" id="cardPager" aria-label="Projects" hidden></div>
    <div class="ghost" id="ghost"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    (function () {
        "use strict";

        // Fetch Orbitron now: nothing on the intro uses it (the header is images), so otherwise the browser waits until the
        // menu first shows, which then draws in a stand-in font and jumps when Orbitron arrives
        if (document.fonts && document.fonts.load) {
            ["400", "600", "700"].forEach(function (weight) { document.fonts.load(weight + " 16px Orbitron"); });
        }

        // Look
        var RADIUS = 300;
        var DOT_COUNT = 1000;
        var SPIKE_COUNT = 520;
        var DOT_COLOR = new THREE.Color(0xe0e0e0);
        var GLOW_COLOR = new THREE.Color(0xff6b35);   // Pyrothief orange
        // The sunrise: the flame's own colours, top to bottom (sampled from the logo): gold at the tip, through orange, to
        // red at the base. Glowing dots take their colour from it by height, so a glow cascades like the logo does
        var SUNRISE = [new THREE.Color(0xfd9d0a), new THREE.Color(0xf46f0c), new THREE.Color(0xe75114),
            new THREE.Color(0xe8271e)];
        var sunriseColor = new THREE.Color();
        // p: 0 at the top → 1 at the bottom
        function sunrise(p) {
            p = Math.max(0, Math.min(1, p)) * (SUNRISE.length - 1);
            var at = Math.min(SUNRISE.length - 2, Math.floor(p));
            return sunriseColor.copy(SUNRISE[at]).lerp(SUNRISE[at + 1], p - at);
        }
        // The icons' ice: near-white at the top, through pale and sky blue, to deep blue at the bottom
        var ICE = [new THREE.Color(0xf2fbff), new THREE.Color(0xb5e2ff), new THREE.Color(0x74b9ff),
            new THREE.Color(0x3f7fff)];
        var iceColor = new THREE.Color();
        // p: 0 at the top → 1 at the bottom
        function ice(p) {
            p = Math.max(0, Math.min(1, p)) * (ICE.length - 1);
            var at = Math.min(ICE.length - 2, Math.floor(p));
            return iceColor.copy(ICE[at]).lerp(ICE[at + 1], p - at);
        }
        // Nova's icon is gold: pale gold at the top through gold to deep amber at the bottom
        var GOLD = [new THREE.Color(0xffe08a), new THREE.Color(0xffc53d), new THREE.Color(0xf2a20c),
            new THREE.Color(0xd97b06)];
        var goldColor = new THREE.Color();
        // p: 0 at the top → 1 at the bottom
        function gold(p) {
            p = Math.max(0, Math.min(1, p)) * (GOLD.length - 1);
            var at = Math.min(GOLD.length - 2, Math.floor(p));
            return goldColor.copy(GOLD[at]).lerp(GOLD[at + 1], p - at);
        }
        var DOT_SIZE = 3.2;
        var GLOW_SIZE = 6.5;
        var CARD_DIM = 0.72;    // how much the stars fade back while a project shows (its icon stays full)
        var cardDim = 0;        // eased 0 → 1 while a card shows

        // Pointer bulge: dots within this angle of the point under the pointer swell outwards and glow
        var BULGE_ANGLE = 0.42;    // radians
        var BULGE_HEIGHT = 70;
        var BULGE_EASE = 0.14;

        // Skew (inside the sphere): dots near the pointer are pushed aside on screen and light up
        var SKEW_RADIUS = 220;     // px
        var SKEW_STRENGTH = 120;   // px at the pointer
        var SKEW_EASE = 0.16;

        // Spin
        var SPIN_GAIN = 0.0002;    // with the friction, the globe turns about 0.003 rad per pixel the pointer moves
        var SPIN_FRICTION = 0.93;

        var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var canvas = document.getElementById("sphere");

        var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(50, 1, 1, 10000);
        var globe = new THREE.Group();
        scene.add(globe);

        // The Pyrothief flame (pyrothieflogo.png, sampled once on a grid): [across, up] as fractions of its height,

            if (now) { backdropSnap = true; cardDim = 1; }   // (from the start: in, and as dim as at Splash's end, at once)
        }
        window.becomeBackdrop = function () { becomeBackdrop(false); };
        if (tourHash.backdrop) becomeBackdrop(true);
        window.addEventListener("pointerdown", interruptTour, true);
        window.addEventListener("wheel", interruptTour, true);
        window.addEventListener("keydown", interruptTour, true);


        // The loop: the page's clock moves on with real time, one step of everything per frame, then a picture
        var lastReal = performance.now();
        function frame() {
            var nowReal = performance.now();
            simTime += Math.min(0.1, (nowReal - lastReal) / 1000);
            lastReal = nowReal;
            simulate(simTime);
            renderer.render(scene, camera);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
