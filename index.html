<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyrothief Projects</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.15em;
            color: #f5f5f5;
            overflow: hidden;
        }
        /* The sphere fills the window behind everything */
        #sphere {
            position: fixed;
            inset: 0;
            touch-action: none;
        }
        #sphere.locked { cursor: grab; }
        #sphere.locked.dragging { cursor: grabbing; }
        /* The header: the PYROTHIEF wordmark (pyrothieftext.png), centred at the top, outside and inside. The image's black
           background is screened away, so only the letters show over the stars */
        main {
            position: fixed;
            top: 1.65rem;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;   /* drags and hovers go through to the sphere */
        }
        .wordmark {
            display: block;
            height: 22px;
            width: auto;
            mix-blend-mode: screen;
        }
        /* PROJECTS (projectstext.png): under the wordmark, lined up with its right edge as in the logo; as you zoom in it
           slides to the left margin, level with the wordmark, and becomes the button for the menu (the frame places it) */
        .projects-button {
            position: fixed;
            top: 0;
            left: 0;
            padding: 0;
            background: none;
            border: none;
            transform-origin: 0 0;
            pointer-events: none;
            opacity: 0;   /* until the flame gathers (the frame sets it) */
            will-change: transform;
            transition: filter 0.2s;
        }
        .projects-button::after {   /* a bigger target than the thin lettering, for fingers */
            content: "";
            position: absolute;
            inset: -12px -10px;
        }
        .projects-button.live { pointer-events: auto; cursor: pointer; }
        .projects-button.live:hover { filter: brightness(1.25); }
        .projects-button.open { filter: drop-shadow(0 0 8px rgba(244, 111, 12, 0.7)); }
        .wordmark-sub {
            display: block;
            height: 12px;
            width: auto;
        }
        @media (max-width: 600px) {
            .wordmark { height: 16px; }
            .wordmark-sub { height: 9px; }
        }
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        /* Random / Nova switch, top right */
        .modes[hidden] { display: none; }
        .modes {
            position: fixed;
            top: 1.5rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
        }
        .modes button {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.6);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 107, 53, 0.3);
            border-radius: 4px;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
        }
        .modes button[hidden] { display: none; }
        .modes button.on {
            color: #0a0a0a;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            border-color: transparent;
        }
        /* The name of the constellation under the pointer (Nova) */
        /* While the menu is open: the stars dim behind it (darkest at the top left, where the menu is) so the rows read
           clearly. It doesn't catch the pointer, so a tap on the stars still closes the menu */
        .dim {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 0% 0%, rgba(10, 10, 10, 0.9), rgba(10, 10, 10, 0.62) 55%,
                rgba(10, 10, 10, 0.5));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .dim.on { opacity: 1; }
        /* The Projects menu: under the header, rows sliding in one after another */
        .projects-menu {
            position: fixed;
            top: 4.6rem;
            left: 1rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.15rem;
            padding: 0.6rem 0.4rem 0.6rem 0;
            max-height: calc(100vh - 5.6rem);   /* scrolls rather than running off a short screen */
            overflow-y: auto;
            overscroll-behavior: contain;
        }
        .projects-menu[hidden], .projects-menu .submenu[hidden] { display: none; }
        .projects-menu .submenu {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.15rem;
            margin-left: 1.1rem;
            padding-left: 0.6rem;
        }
        .projects-menu button {
            position: relative;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.62);
            background: none;
            border: none;
            padding: 0.45rem 0.6rem 0.45rem 0.9rem;
            cursor: pointer;
            text-align: left;
            text-shadow: 0 0 10px #0a0a0a;
            animation: rowIn 0.38s cubic-bezier(0.2, 0.8, 0.2, 1) both;
            animation-delay: calc(var(--i, 0) * 55ms);
        }
        /* The bar at the left, grown in on hover or when it's the one showing */
        .projects-menu button::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 2px;
            height: 0;
            background: linear-gradient(180deg, #ffa500, #ff6b35);
            transform: translateY(-50%);
            transition: height 0.2s;
        }
        .projects-menu button:hover, .projects-menu button.on {
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }
        .projects-menu button:hover::before, .projects-menu button.on::before { height: 70%; }
        @keyframes rowIn {
            from { opacity: 0; transform: translateX(-14px); }
            to { opacity: 1; transform: none; }
        }
        /* A project's card: glass, low in the middle, rising in (its icon forms in dots above it) */
        .card {
            position: fixed;
            left: 50%;
            bottom: 5.2rem;
            width: min(520px, calc(100vw - 2rem));
            padding: 1.4rem 1.5rem 1.3rem;
            background: rgba(10, 10, 10, 0.55);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 107, 53, 0.35);
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(255, 107, 53, 0.12), inset 0 0 30px rgba(255, 107, 53, 0.04);
            opacity: 0;
            /* --dx: sideways, for a codex flip (out the way it's going, in from the other side) */
            transform: translate(-50%, 0) translate(var(--dx, 0px), 18px);
            transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            pointer-events: none;
        }
        .card[hidden] { display: none; }
        .card.shown { opacity: 1; transform: translate(-50%, 0) translate(0, 0); pointer-events: auto; }
        .card.still { transition: none; }
        /* On a phone, tucked away while the Projects menu is open (no room for both); back when it closes */
        .card.shown.tucked { opacity: 0; transform: translate(-50%, 0) translate(0, 18px); pointer-events: none; }
        /* The codex's pages: one dot per project, the one showing lit */
        /* The codex's dots: under PROJECTS, lined up with its left edge, while a project is up and the menu is closed
           (the frame places them) */
        .card-pager {
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card-pager button {
            width: 7px;
            height: 7px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(245, 245, 245, 0.25);
            cursor: pointer;
            transition: transform 0.25s, background 0.25s;
        }
        .card-pager button.on {
            background: linear-gradient(180deg, #fd9d0a, #e8271e);
            transform: scale(1.4);
            box-shadow: 0 0 8px rgba(244, 111, 12, 0.7);
        }
        .card-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem 0.9rem;
            margin-bottom: 0.55rem;
        }
        .card-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.75);
            border: 1px solid rgba(245, 245, 245, 0.18);
            border-radius: 999px;
            padding: 0.3rem 0.65rem;
        }
        .pill[hidden] { display: none; }
        .pill i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--status, #ff6b35);
            box-shadow: 0 0 8px var(--status, #ff6b35);
        }
        .card-tagline {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            color: #ffb27a;
            margin-bottom: 0.75rem;
        }
        .card-text {
            font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
            font-size: 0.95rem;
            line-height: 1.55;
            letter-spacing: normal;
            color: rgba(245, 245, 245, 0.86);
            margin-bottom: 0.9rem;
            /* A long one (the License) scrolls inside the card, so the card never covers the icon above it */
            max-height: 36vh;
            overflow-y: auto;
            overscroll-behavior: contain;
        }
        .card-text p + p { margin-top: 0.65rem; }
        .card-text h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #ffb27a;
            margin: 0.9rem 0 0.25rem;
        }
        .card-text h3:first-child { margin-top: 0; }
        .card-tech {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.45);
        }
        /* The HUD: a project shown around its icon instead of in a card — its name and tagline above, its status and tech
           below, and leader lines drawing out from the icon to short labels that type themselves in (the frame places it
           all). On a phone the labels stack in a list under it */
        .hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .hud[hidden] { display: none; }
        .hud.shown { opacity: 1; }
        .hud.shown.tucked { opacity: 0; }
        .hud-lines {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        .hud-lines path {
            fill: none;
            stroke: rgba(244, 111, 12, 0.85);
            stroke-width: 1.2;
        }
        .hud-lines circle { fill: #fd9d0a; }
        .hud-head, .hud-foot {
            position: absolute;
            text-align: center;
            white-space: nowrap;
        }
        .hud-head { transform: translate(-50%, -100%); }
        /* The badge, then the platforms, on one line */
        .hud-foot {
            transform: translate(-50%, 0);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 0.75rem;
        }
        .hud-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hud-tagline {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            color: #ffb27a;
            margin-top: 0.35rem;
            text-shadow: 0 0 10px #0a0a0a;
        }
        .hud-tech {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.56rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.45);
        }
        /* A project's link (Drift Remote's TestFlight), on the badge line — the one part of the HUD that takes a click */
        .hud-link {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.56rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            /* The site's orange, glowing (breathing a little), no underline */
            color: #ff8a3d;
            text-decoration: none;
            text-shadow: 0 0 6px rgba(255, 107, 53, 0.85), 0 0 14px rgba(255, 107, 53, 0.45);
            animation: betaGlow 2.4s ease-in-out infinite;
            pointer-events: auto;
            transition: color 0.2s;
        }
        @keyframes betaGlow {
            50% { text-shadow: 0 0 9px rgba(255, 107, 53, 1), 0 0 22px rgba(255, 107, 53, 0.6); }
        }
        .hud-link[hidden] { display: none; }
        .hud-link:hover { color: #ffa500; }
        .hud-label {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.66rem;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.92);
            white-space: nowrap;
            text-shadow: 0 0 10px #0a0a0a, 0 0 3px #0a0a0a;
        }
        .hud-label[hidden] { display: none; }
        /* A phone: the labels as a list, each with a short sunrise tick */
        .hud-label.listed { white-space: normal; max-width: calc(100vw - 48px); }
        .hud-label.listed::before {
            content: "";
            display: inline-block;
            width: 14px;
            height: 1px;
            margin-right: 0.6rem;
            vertical-align: middle;
            background: linear-gradient(90deg, #fd9d0a, #e8271e);
        }
        @media (max-width: 600px) {
            .hud-name { font-size: 1.1rem; }
            .hud-tagline { font-size: 0.62rem; }
        }
        /* The tour's ghost cursor: a glowing ring with a bright centre; a click ripples out from it. Hidden for now — it
           still points and clicks (the flame gathers, the dots part), it just isn't drawn */
        .ghost {
            visibility: hidden;
            position: fixed;
            left: 0;
            top: 0;
            width: 26px;
            height: 26px;
            margin: -13px 0 0 -13px;
            border-radius: 50%;
            border: 2px solid rgba(255, 178, 122, 0.95);
            box-shadow: 0 0 12px rgba(255, 107, 53, 0.8), inset 0 0 6px rgba(255, 107, 53, 0.6);
            pointer-events: none;
            opacity: 0;
        }
        .ghost::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 6px;
            height: 6px;
            margin: -3px 0 0 -3px;
            border-radius: 50%;
            background: #ffe0b0;
            box-shadow: 0 0 6px #ffb27a;
        }
        .ghost.click::after {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 2px solid #ffb27a;
            animation: ghostClick 0.6s ease-out forwards;
        }
        @keyframes ghostClick { from { transform: scale(1); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
        /* The tour's player bar (a link with "&tool"): play / pause, the whole run as a slider, speed, restart */
        .tour-bar {
            position: fixed;
            left: 50%;
            bottom: 1rem;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: min(560px, calc(100vw - 2rem));
            padding: 0.55rem 0.7rem;
            background: rgba(10, 10, 10, 0.62);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 107, 53, 0.35);
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
        }
        .tour-bar[hidden] { display: none; }
        .tour-bar button {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 0.08em;
            color: rgba(245, 245, 245, 0.75);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 107, 53, 0.3);
            border-radius: 4px;
            padding: 0.35rem 0.5rem;
            cursor: pointer;
            flex: none;
        }
        .tour-bar button.on {
            color: #0a0a0a;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            border-color: transparent;
        }
        .tour-bar input[type="range"] { flex: 1; min-width: 0; accent-color: #ff6b35; }
        .tour-time {
            font-size: 0.58rem;
            letter-spacing: 0.08em;
            color: rgba(245, 245, 245, 0.6);
            width: 3.2rem;
            text-align: right;
            flex: none;
        }
        /* A link to the full text (Privacy, License) */
        .card-link {
            display: inline-block;
            margin-top: 0.8rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ffb27a;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 107, 53, 0.4);
            padding-bottom: 0.15rem;
        }
        .card-link[hidden], .card-pager[hidden] { display: none; }
        .card-link:hover { color: #ff6b35; border-color: #ff6b35; }
        /* Nova's jump: the page goes dark as the stars streak past, then the Nova page */
        .jump-fade {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.7s ease-in;
        }
        .jump-fade.on { opacity: 1; }
        /* A phone: the menu across the top, bigger rows; the card along the bottom */
        @media (max-width: 600px) {
            .projects-menu { right: 1rem; }
            .projects-menu button { font-size: 0.8rem; padding: 0.65rem 0.6rem 0.65rem 0.9rem; }
            .card { bottom: 4.6rem; padding: 1.1rem 1.1rem 1rem; }
            .card-name { font-size: 1.05rem; }
            .card-text { font-size: 0.9rem; }
        }
        /* Inside the sphere: Warp, Drift and Reach, along the bottom */
        .inside-controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }
        .inside-controls[hidden] { display: none; }
        .inside-controls button {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.6);
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid rgba(255, 107, 53, 0.3);
            border-radius: 4px;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
        }
        .inside-controls button.on {
            color: #0a0a0a;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            border-color: transparent;
        }
        .inside-controls label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.6);
        }
        .inside-controls input[type="range"] {
            width: 6rem;
            accent-color: #ff6b35;
        }
        /* Back out of the sphere (shown while inside) */
        .exit {
            position: fixed;
            top: 1.1rem;
            right: 1rem;
            width: 2.5rem;
            height: 2.5rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: #ff6b35;
            background: rgba(10, 10, 10, 0.35);   /* an orange ring with an orange ✕ */
            border: 1.5px solid #ff6b35;
            border-radius: 50%;
            cursor: pointer;
            transition: box-shadow 0.2s, color 0.2s, border-color 0.2s;
        }
        .exit:hover { color: #ffa500; border-color: #ffa500; box-shadow: 0 0 12px rgba(255, 107, 53, 0.5); }
        .exit[hidden] { display: none; }
        .label {
            position: fixed;
            transform: translate(-50%, -50%);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #ff6b35;
            text-shadow: 0 0 8px #0a0a0a, 0 0 2px #0a0a0a;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        /* Nova: the 12 signs; picking one turns the globe to it */
        .signs {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.4rem;
            padding: 0 1rem;
            transition: opacity 0.3s;
        }
        .signs[hidden] { display: none; }
        .signs button {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(245, 245, 245, 0.7);
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid rgba(255, 107, 53, 0.3);
            border-radius: 4px;
            padding: 0.45rem 0.6rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .signs button .glyph { margin-right: 0.35rem; }
        .signs button.on {
            color: #0a0a0a;
            background: linear-gradient(135deg, #ffa500, #ff6b35);
            border-color: transparent;
        }
        /* A phone: one scrolling row instead of several */
        @media (max-width: 600px) {
            .signs {
                flex-wrap: nowrap;
                justify-content: flex-start;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            .signs::-webkit-scrollbar { display: none; }
        }
    </style>
</head>
<body>
    <canvas id="sphere"></canvas>
    <div class="dim" id="dim"></div>
    <main id="main">
        <img class="wordmark" id="wordmark" src="content/logo/pyrothieftext.png" alt="Pyrothief">
    </main>
    <button type="button" class="projects-button" id="lockup" aria-label="Projects" aria-expanded="false" tabindex="-1">
        <img class="wordmark-sub" src="content/logo/projectstext.png" alt="Projects">
    </button>

        // ---------------- The tour: a link like pyrothief.ca/#drift plays the way there by itself ----------------

            requestAnimationFrame(frame);
        }
        // A link with "t=…" (the bar's slider): play the page through to that moment first, unseen
        var seekTo = parseFloat(tourHash.t) || 0;
        if (seekTo > 0) {
            fastForwarding = true;
            var ffSteps = Math.round(seekTo * 60);
            for (var ff = 0; ff < ffSteps; ff++) {
                if (ff === ffSteps - 1) fastForwarding = false;   // the last step lays everything out
                simTime += 1 / 60;
                simulate(simTime);
            }
            fastForwarding = false;
        }
        if (tourHash.paused && tourActive) playing = false;
        showPlaying();
        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
